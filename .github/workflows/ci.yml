# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:

  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: go vet ./...
      - run: go test -race ./...
  lint:
    name: gofmt + staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: test -z "$(gofmt -l .)"
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
  vectors:
    name: vectors match wutong-protocol@main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: {repository: project-wutong/wutong-protocol, path: wutong-protocol}
      - run: |
          diff -r wutong-protocol/vectors/crosslang testdata/crosslang
          for f in jcs_pairs.json dcbor_pairs.json sha256.json; do diff wutong-protocol/vectors/$f testdata/$f; done
